<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="icon" type="image/png" href="logo.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#152130" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Studio Canvas Mobile</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #334155;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --btn-success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', 'Pyidaungsu', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            height: 55px;
        }
        .header h1 { font-size: 16px; color: var(--accent-color); font-weight: 700; }
        .header-btns { display: flex; gap: 6px; }
        .btn-sm {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Main Workspace Container */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Canvas Display Area */
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #020617;
            padding: 10px;
            position: relative;
            overflow: auto;
        }
        canvas {
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            touch-action: none; /* Prevents scrolling while dragging on canvas */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Mobile Bottom Tab Controls */
        .controls-panel {
            background: var(--bg-sidebar);
            border-top: 1px solid var(--border-color);
            height: 250px;
            display: flex;
            flex-direction: column;
        }

        .tab-buttons {
            display: flex;
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            text-align: center;
        }
        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            background: var(--bg-sidebar);
        }

        .tab-content-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }
        .tab-content { display: none; flex-direction: column; gap: 10px; }
        .tab-content.active { display: flex; }

        /* Form Controls UI */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

        label { font-size: 11px; color: var(--text-muted); }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 8px; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 6px;
            color: var(--text-main); font-size: 12px; outline: none;
        }

        input[type="range"] { width: 100%; accent-color: var(--accent-color); }
        input[type="color"] { width: 100%; height: 35px; border: none; background: transparent; cursor: pointer; }

        .action-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
        }
        .action-btn.active { background: var(--accent-color); color: #0f172a; }
        
        .export-btn {
            background: var(--btn-success);
            color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px;
        }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            .workspace { flex-direction: row; }
            .controls-panel { width: 350px; height: 100%; border-top: none; border-left: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>STUDIO CANVAS</h1>
        <div class="header-btns">
            <button class="btn-sm" id="undoBtn">↩️</button>
            <button class="btn-sm" id="redoBtn">↪️</button>
            <button class="btn-sm" id="resetBtn">🔄 Reset</button>
        </div>
    </div>

    <!-- Main Section -->
    <div class="workspace">
        <!-- Canvas View -->
        <div class="canvas-container">
            <canvas id="editorCanvas" width="800" height="600"></canvas>
        </div>

        <!-- Mobile Controls Panel -->
        <div class="controls-panel">
            <!-- Tabs Navigation -->
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('tab-layers')">🖼️ Layers</button>
                <button class="tab-btn" onclick="switchTab('tab-filter')">⚙️ Adjust</button>
                <button class="tab-btn" onclick="switchTab('tab-text')">✍️ Text</button>
                <button class="tab-btn" onclick="switchTab('tab-draw')">🎨 Draw/Shapes</button>
                <button class="tab-btn" onclick="switchTab('tab-export')">📥 Export</button>
            </div>

            <!-- Tab Contents -->
            <div class="tab-content-container">
                
                <!-- Tab: Layers & Canvas -->
                <div id="tab-layers" class="tab-content active">
                    <div>
                        <label>+ ဓာတ်ပုံထည့်ရန်</label>
                        <input type="file" id="imageLoader" accept="image/*">
                    </div>
                    <div class="grid-2">
                        <button class="action-btn" id="deleteLayerBtn">❌ ဖျက်မည်</button>
                        <button class="action-btn" id="bringForwardBtn">⬆️ ရှေ့သို့ယူမည်</button>
                    </div>
                    <div class="grid-3" style="margin-top: 5px;">
                        <div><label>W (px)</label><input type="number" id="canvasW" value="800"></div>
                        <div><label>H (px)</label><input type="number" id="canvasH" value="600"></div>
                        <div><label>BG</label><input type="color" id="bgColor" value="#ffffff"></div>
                    </div>
                </div>

                <!-- Tab: Filters & Transform -->
                <div id="tab-filter" class="tab-content">
                    <div class="grid-2">
                        <button class="action-btn" id="flipHBtn">↔️ Flip H</button>
                        <button class="action-btn" id="flipVBtn">↕️ Flip V</button>
                    </div>
                    <div>
                        <label>Rotate Angle: <span id="rotVal">0°</span></label>
                        <input type="range" id="rotateSlider" min="0" max="360" value="0">
                    </div>
                    <div>
                        <label>Brightness: <span id="brightVal">100%</span></label>
                        <input type="range" id="brightSlider" min="0" max="200" value="100">
                    </div>
                    <div>
                        <label>Contrast: <span id="contrastVal">100%</span></label>
                        <input type="range" id="contrastSlider" min="0" max="200" value="100">
                    </div>
                </div>

                <!-- Tab: Text -->
                <div id="tab-text" class="tab-content">
                    <textarea id="textInput" rows="2" placeholder="စာသားရိုက်ထည့်ပါ...">မင်္ဂလာပါ</textarea>
                    <div class="grid-3">
                        <div><label>Size</label><input type="number" id="textSize" value="40"></div>
                        <div><label>Color</label><input type="color" id="textColor" value="#000000"></div>
                        <div>
                            <label>Font</label>
                            <select id="textFont">
                                <option value="'Pyidaungsu', sans-serif">ပြည်ထောင်စု</option>
                                <option value="sans-serif">Default</option>
                            </select>
                        </div>
                    </div>
                    <button class="action-btn" id="addTextBtn" style="background: var(--accent-color); color: #0f172a;">+ စာသားထည့်မည်</button>
                </div>

                <!-- Tab: Draw & Shapes -->
                <div id="tab-draw" class="tab-content">
                    <div class="grid-3">
                        <button class="action-btn" id="brushToggleBtn">✏️ Brush</button>
                        <div><label>Size</label><input type="number" id="brushSize" value="5"></div>
                        <div><label>Color</label><input type="color" id="brushColor" value="#ef4444"></div>
                    </div>
                    <div class="grid-3">
                        <button class="action-btn" id="addRectBtn">⬛ Square</button>
                        <button class="action-btn" id="addCircleBtn">🔴 Circle</button>
                        <button class="action-btn sticker-btn" data-emoji="🔥">🔥 Emoji</button>
                    </div>
                </div>

                <!-- Tab: Export -->
                <div id="tab-export" class="tab-content">
                    <div class="grid-2">
                        <div>
                            <label>Format</label>
                            <select id="exportFormat">
                                <option value="png">PNG</option>
                                <option value="jpeg">JPG</option>
                                <option value="webp">WEBP</option>
                            </select>
                        </div>
                        <div>
                            <label>Quality</label>
                            <input type="number" id="exportQuality" min="0.1" max="1" step="0.1" value="0.9">
                        </div>
                    </div>
                    <button class="export-btn" id="exportBtn">✨ ဓာတ်ပုံသိမ်းဆည်းမည်</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        document.addEventListener("DOMContentLoaded", function() {
            const canvas = document.getElementById('editorCanvas');
            const ctx = canvas.getContext('2d');

            let layers = [];
            let activeLayerIndex = -1;
            let undoStack = [];
            let redoStack = [];

            let isBrushMode = false;
            let isDrawing = false;
            let currentPath = [];

            function saveState() {
                if (undoStack.length > 20) undoStack.shift();
                undoStack.push(JSON.stringify(layers));
                redoStack = [];
            }

            function undo() {
                if (undoStack.length > 0) {
                    redoStack.push(JSON.stringify(layers));
                    layers = JSON.parse(undoStack.pop());
                    reconstructImages();
                    drawEverything();
                }
            }

            function redo() {
                if (redoStack.length > 0) {
                    undoStack.push(JSON.stringify(layers));
                    layers = JSON.parse(redoStack.pop());
                    reconstructImages();
                    drawEverything();
                }
            }

            function reconstructImages() {
                layers.forEach(layer => {
                    if (layer.type === 'image' && layer.src) {
                        const img = new Image();
                        img.src = layer.src;
                        layer.imgObj = img;
                    }
                });
            }

            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);

            // Canvas Dimensions & BG
            const canvasW = document.getElementById('canvasW');
            const canvasH = document.getElementById('canvasH');
            const bgColor = document.getElementById('bgColor');

            function updateCanvasSize() {
                canvas.width = parseInt(canvasW.value) || 800;
                canvas.height = parseInt(canvasH.value) || 600;
                drawEverything();
            }
            canvasW.addEventListener('input', updateCanvasSize);
            canvasH.addEventListener('input', updateCanvasSize);
            bgColor.addEventListener('input', drawEverything);

            // Add Image Layer
            document.getElementById('imageLoader').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        saveState();
                        layers.push({
                            id: Date.now(),
                            type: 'image',
                            imgObj: img,
                            src: event.target.result,
                            x: 50, y: 50,
                            w: img.width > 300 ? 300 : img.width,
                            h: img.width > 300 ? (img.height * (300 / img.width)) : img.height,
                            flipH: false, flipV: false, rotate: 0,
                            brightness: 100, contrast: 100
                        });
                        activeLayerIndex = layers.length - 1;
                        drawEverything();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // Delete & Order
            document.getElementById('deleteLayerBtn').addEventListener('click', () => {
                if (activeLayerIndex >= 0) {
                    saveState();
                    layers.splice(activeLayerIndex, 1);
                    activeLayerIndex = layers.length - 1;
                    drawEverything();
                }
            });

            // Add Text
            document.getElementById('addTextBtn').addEventListener('click', () => {
                saveState();
                layers.push({
                    id: Date.now(),
                    type: 'text',
                    text: document.getElementById('textInput').value || "စာသား",
                    x: canvas.width / 2, y: canvas.height / 2,
                    size: parseInt(document.getElementById('textSize').value),
                    color: document.getElementById('textColor').value,
                    font: document.getElementById('textFont').value
                });
                activeLayerIndex = layers.length - 1;
                drawEverything();
            });

            // Brush Mode
            const brushBtn = document.getElementById('brushToggleBtn');
            brushBtn.addEventListener('click', () => {
                isBrushMode = !isBrushMode;
                brushBtn.classList.toggle('active', isBrushMode);
            });

            // Filters Input
            const rotateSlider = document.getElementById('rotateSlider');
            const brightSlider = document.getElementById('brightSlider');
            const contrastSlider = document.getElementById('contrastSlider');

            function applyFilterTransform() {
                if (activeLayerIndex >= 0 && layers[activeLayerIndex].type === 'image') {
                    const l = layers[activeLayerIndex];
                    l.rotate = parseInt(rotateSlider.value);
                    l.brightness = parseInt(brightSlider.value);
                    l.contrast = parseInt(contrastSlider.value);
                    document.getElementById('rotVal').innerText = l.rotate + "°";
                    document.getElementById('brightVal').innerText = l.brightness + "%";
                    document.getElementById('contrastVal').innerText = l.contrast + "%";
                    drawEverything();
                }
            }
            [rotateSlider, brightSlider, contrastSlider].forEach(el => el.addEventListener('input', applyFilterTransform));

            document.getElementById('flipHBtn').addEventListener('click', () => {
                if (activeLayerIndex >= 0 && layers[activeLayerIndex].type === 'image') {
                    layers[activeLayerIndex].flipH = !layers[activeLayerIndex].flipH;
                    drawEverything();
                }
            });

            // Render Function
            function drawEverything() {
                ctx.fillStyle = bgColor.value;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                layers.forEach((layer, index) => {
                    ctx.save();

                    if (layer.type === 'image' && layer.imgObj) {
                        ctx.translate(layer.x + layer.w / 2, layer.y + layer.h / 2);
                        ctx.rotate((layer.rotate || 0) * Math.PI / 180);
                        ctx.scale(layer.flipH ? -1 : 1, layer.flipV ? -1 : 1);
                        ctx.filter = `brightness(${layer.brightness}%) contrast(${layer.contrast}%)`;
                        ctx.drawImage(layer.imgObj, -layer.w / 2, -layer.h / 2, layer.w, layer.h);

                    } else if (layer.type === 'text') {
                        ctx.font = `${layer.size}px ${layer.font}`;
                        ctx.fillStyle = layer.color;
                        ctx.textAlign = 'center';
                        ctx.fillText(layer.text, layer.x, layer.y);

                    } else if (layer.type === 'path') {
                        ctx.strokeStyle = layer.color;
                        ctx.lineWidth = layer.size;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        layer.points.forEach((pt, i) => {
                            if (i === 0) ctx.moveTo(pt.x, pt.y);
                            else ctx.lineTo(pt.x, pt.y);
                        });
                        ctx.stroke();
                    }

                    if (index === activeLayerIndex && layer.type === 'image') {
                        ctx.strokeStyle = '#38bdf8';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(layer.x - 2, layer.y - 2, layer.w + 4, layer.h + 4);
                    }

                    ctx.restore();
                });
            }

            // Universal Touch / Drag Handler (Support Mobile Touch Events)
            let isDragging = false;
            let dragOffset = { x: 0, y: 0 };

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function handleStart(e) {
                const pos = getPos(e);

                if (isBrushMode) {
                    isDrawing = true;
                    saveState();
                    currentPath = [{ x: pos.x, y: pos.y }];
                    layers.push({
                        type: 'path',
                        points: currentPath,
                        color: document.getElementById('brushColor').value,
                        size: parseInt(document.getElementById('brushSize').value)
                    });
                    activeLayerIndex = layers.length - 1;
                    return;
                }

                for (let i = layers.length - 1; i >= 0; i--) {
                    const l = layers[i];
                    if (l.type === 'image' && pos.x >= l.x && pos.x <= l.x + l.w && pos.y >= l.y && pos.y <= l.y + l.h) {
                        activeLayerIndex = i;
                        isDragging = true;
                        dragOffset = { x: pos.x - l.x, y: pos.y - l.y };
                        drawEverything();
                        return;
                    } else if (l.type === 'text') {
                        activeLayerIndex = i;
                        isDragging = true;
                        dragOffset = { x: pos.x - l.x, y: pos.y - l.y };
                        drawEverything();
                        return;
                    }
                }
            }

            function handleMove(e) {
                if (!isDragging && !isDrawing) return;
                const pos = getPos(e);

                if (isDrawing && isBrushMode) {
                    currentPath.push({ x: pos.x, y: pos.y });
                    drawEverything();
                } else if (isDragging && activeLayerIndex >= 0) {
                    const l = layers[activeLayerIndex];
                    l.x = pos.x - dragOffset.x;
                    l.y = pos.y - dragOffset.y;
                    drawEverything();
                }
            }

            function handleEnd() {
                if (isDragging || isDrawing) saveState();
                isDragging = false;
                isDrawing = false;
            }

            // Mouse Events
            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);

            // Mobile Touch Events
            canvas.addEventListener('touchstart', handleStart);
            canvas.addEventListener('touchmove', handleMove);
            window.addEventListener('touchend', handleEnd);

            // Export Output
            document.getElementById('exportBtn').addEventListener('click', () => {
                const format = document.getElementById('exportFormat').value;
                const quality = parseFloat(document.getElementById('exportQuality').value) || 0.9;
                const a = document.createElement('a');
                a.href = canvas.toDataURL(`image/${format}`, quality);
                a.download = `mobile-canvas-${Date.now()}.${format}`;
                a.click();
            });

            // Reset Workspace
            document.getElementById('resetBtn').addEventListener('click', () => {
                if (confirm('Workspace အသစ် ပြန်စမှာ သေချာပါသလား?')) {
                    layers = [];
                    activeLayerIndex = -1;
                    drawEverything();
                }
            });

            drawEverything();
        });
    </script>
</body>
</html>
